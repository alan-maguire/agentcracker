# Build agentcracker (firecracker, guest kernel, tool) and run tests/, on
# x86_64 and aarch64.  On x86_64 (GitHub's hosted runners have KVM) any
# failing test fails the run.  aarch64 is experimental: its job may fail
# without failing the run, and where its runner has no usable /dev/kvm it
# builds only and says so.  GitHub's hosted arm64 runners (free for public
# repositories) are not documented to expose KVM; to test there, point the
# repository variable AARCH64_RUNNER at a runner that has it, e.g. a
# self-hosted Graviton .metal instance (Ubuntu, with passwordless sudo).
name: tests

# main and pull requests only (a pushed PR branch would otherwise run
# twice), plus on demand
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            experimental: false
          - arch: aarch64
            runner: ${{ vars.AARCH64_RUNNER || 'ubuntu-24.04-arm' }}
            experimental: true
    env:
      # nested virtualisation on a shared runner is slower than a workstation;
      # these are t02-timing.sh's limits (seconds)
      AC_MAX_WARM: "10"
      AC_MAX_FIRST: "5"
      AC_MAX_TEARDOWN: "5"
      AC_MAX_NEWPROJ: "30"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      # without KVM there is nothing to test, only the build: an error on
      # x86_64, a warning on aarch64
      - name: Enable KVM for the runner user
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sleep 1
            ls -l /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            msg="no usable /dev/kvm on this ${{ matrix.arch }} runner (${{ matrix.runner }})"
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              echo "::error::$msg"
              exit 1
            fi
            echo "::warning::$msg: building only, tests skipped; set the AARCH64_RUNNER variable to a runner with KVM"
            echo "**${{ matrix.arch }}: built only, tests skipped** - $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Ubuntu's AppArmor refuses unprivileged user namespaces, which
      # Firecracker's sandbox is built from (t10 checks it)
      - name: Allow unprivileged user namespaces
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e $f ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      # The runner's filesystem has no reflinks, so the guest's /usr snapshot
      # is a real copy: drop the large preinstalled SDKs the tests never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /usr/lib/jvm \
            /usr/local/.ghcup /opt/ghc /usr/local/share/boost /usr/local/share/chromium \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc perl curl xz-utils git e2fsprogs \
            libelf-dev libssl-dev libc6-dev python3
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache keys
        id: keys
        run: |
          echo "kver=$(sed -n 's/^KVER *:= *//p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "fc=$(git rev-parse HEAD:firecracker)" >> "$GITHUB_OUTPUT"

      # caches are restored here and saved at the end even when tests fail,
      # so a failing run does not throw away a 10-minute kernel build
      - name: Restore guest kernel
        id: kernel
        uses: actions/cache/restore@v4
        with:
          path: build/vmlinux-${{ steps.keys.outputs.kver }}
          key: vmlinux-${{ matrix.arch }}-${{ steps.keys.outputs.kver }}-${{ hashFiles('kernel/agentcracker*.config', format('firecracker/resources/guest_configs/microvm-kernel-ci-{0}-6.18.config', matrix.arch)) }}

      - name: Restore firecracker build
        id: firecracker
        uses: actions/cache/restore@v4
        with:
          path: firecracker/build/cargo_target
          key: firecracker-${{ matrix.arch }}-${{ steps.keys.outputs.fc }}

      - name: Restore cargo
        id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/acinit-target
          # one entry per Cargo.lock, not per commit: our own crate rebuilds in
          # seconds, and a ~1G entry per push would churn the 10G repo cache
          key: cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: |
          # with a cached kernel, tell make not to rebuild it just because the
          # unpacked kernel source it was built from is not here
          old=()
          if [ "${{ steps.kernel.outputs.cache-hit }}" = true ]; then
            old=(-o "$PWD/build/vmlinux-${{ steps.keys.outputs.kver }}")
          fi
          make "${old[@]}" all

      # Without reflinks the guest's /usr snapshot is a full copy (it took
      # 18 minutes of the first run), so leave out what the tests never use:
      # they need a shell, coreutils, git and curl in the guest.  A minimal
      # PATH keeps the runner's toolchains (~/.rustup, ...) out of the
      # toolchain snapshot for the same reason.  The snapshot is built in a
      # step of its own so its cost shows; the tests then reuse it.
      - name: Snapshot /usr
        if: steps.kvm.outputs.usable == 'true'
        run: |
          mkdir -p build/ci-config/agentcracker
          cat >build/ci-config/agentcracker/config.toml <<'TOML'
          exclude_usr = [
            "/local", "/lib/jvm", "/lib/llvm-*", "/lib/google-cloud-sdk", "/lib/firefox",
            "/lib/mono", "/lib/heroku", "/lib/node_modules", "/lib/gcc", "/libexec/gcc",
            "/share/doc", "/share/man", "/share/info", "/share/locale", "/share/icons",
            "/share/miniconda", "/share/swift", "/share/dotnet", "/share/az_*", "/share/sbt",
            "/share/kotlinc", "/share/gradle*", "/share/apache-maven*", "/share/vcpkg",
            "/share/R", "/lib/R", "/share/fonts", "/share/texmf", "/share/texlive",
          ]
          TOML
          XDG_CONFIG_HOME=$PWD/build/ci-config PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            target/release/agentcracker refresh
          df -h /

      - name: Test
        if: steps.kvm.outputs.usable == 'true'
        env:
          AC_TEST_CONFIG: ${{ github.workspace }}/build/ci-config/agentcracker/config.toml
          AC_TEST_DIR: ${{ github.workspace }}/build/tests
        run: PATH=/usr/sbin:/usr/bin:/sbin:/bin tests/run.sh

      - name: Save guest kernel
        if: always() && steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vmlinux-${{ steps.keys.outputs.kver }}
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      - name: Save firecracker build
        if: always() && steps.firecracker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: firecracker/build/cargo_target
          key: ${{ steps.firecracker.outputs.cache-primary-key }}

      - name: Save cargo
        if: always() && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            build/acinit-target
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      # failing tests keep their work directories; upload the logs, not the
      # (sparse, 64G) disk images
      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-test-logs-${{ matrix.arch }}
          path: |
            build/tests/**/ac.log
            build/tests/**/meta.json
            build/tests/**/console.log
            build/tests/**/net.log
            build/tests/**/stdout
            build/tests/**/stderr
          if-no-files-found: ignore
          retention-days: 7
